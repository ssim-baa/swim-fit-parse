[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swim-fit-parse"
version = "3.5"
description = "Deterministic Garmin lap-swimming .FIT parser — session/lap/block metrics with length-level anomaly detection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ssim-baa" }]
keywords = ["garmin", "fit", "swimming", "lap-swimming", "fitparse"]
dependencies = ["fitparse>=1.2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/ssim-baa/swim-fit-parse"
Source = "https://github.com/ssim-baa/swim-fit-parse"

[project.scripts]
swim-fit-parse = "swim_fit_parse:_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/swim_fit_parse"]
